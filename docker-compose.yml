services:
  # ==============================================================================
  # 1. Cơ sở dữ liệu phân tán: PostgreSQL 17
  # ==============================================================================
  postgres:
    image: postgres:17-alpine
    container_name: distributed_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-document_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-document_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - distributed_network

  # ==============================================================================
  # 2. Message Broker: RabbitMQ 3 with Management UI
  # ==============================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: distributed_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"           # AMQP protocol
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672" # Web Management Dashboard
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - distributed_network

networks:
  distributed_network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:

